[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "paged-collections"
description = "Paged sparse sets, maps and stable-address containers, implemented in Rust"
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hoang-Nhat Tran" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/inspiros/paged-collections"

[dependency-groups]
dev = ["maturin>=1.16,<2", "pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "paged_collections._core"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension when the Rust sources change, not only pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../paged-collections/Cargo.toml" },
    { file = "../paged-collections/src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
