[package]
name = "paged-collections"
description = "Paged sparse sets, maps and stable-address containers"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
## Implements `std`-only conveniences; the crate itself needs only `alloc`.
std = []
## `Serialize`/`Deserialize` for the collections.
serde = ["dep:serde"]
## Concurrent containers using core atomics and alloc.
concurrent = []

[dependencies]
serde = { workspace = true, optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
proptest = "1"
serde_json = "1"

[[bench]]
name = "directory"
harness = false

[[example]]
name = "doc_concurrent"
required-features = ["concurrent"]
