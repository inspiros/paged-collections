[package]
name = "paged-collections"
description = "Paged sparse sets, maps and stable-address containers"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
## Implements `std`-only conveniences; the crate itself needs only `alloc`.
std = []
## `Serialize`/`Deserialize` for the collections.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
