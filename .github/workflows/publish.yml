name: Publish

# Manual only: Actions > Publish > Run workflow, with the release tag (v*) as
# the ref. The Rust crate is the primary package and goes first; the Python
# wheels follow from the same commit.
on:
  workflow_dispatch:

jobs:
  check_ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a v* tag matching the workspace version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run this workflow on a release tag (v*), not $GITHUB_REF"; exit 1 ;;
          esac
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "paged-collections") | .version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::paged-collections $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          echo "Publishing $GITHUB_REF_NAME"

  ci:
    needs: check_ref
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: check_ref
    uses: ./.github/workflows/wheels.yml

  publish_on_crates_io:
    # Waits for the wheels too, so a broken Python build stops the release
    # before anything is uploaded.
    needs: [ci, wheels]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p paged-collections --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_on_pypi:
    needs: publish_on_crates_io
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Check that the files match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          for f in dist/*; do
            case "$(basename "$f")" in
              paged_collections-"$version"-*.whl|paged_collections-"$version".tar.gz) ;;
              *) echo "::error::$f does not match tag $GITHUB_REF_NAME"; exit 1 ;;
            esac
          done
      # Trusted publishing (id-token above); configure the pypi environment
      # as a trusted publisher on PyPI before the first release.
      - uses: pypa/gh-action-pypi-publish@release/v1
