[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "paged-collections"
description = "Paged sparse sets, maps and stable-address containers, implemented in Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hoang-Nhat Tran" }]
keywords = ["sparse-set", "paged", "collections", "data-structures", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.urls]
Documentation = "https://inspiros.github.io/paged-collections/"
Repository = "https://github.com/inspiros/paged-collections"
Issues = "https://github.com/inspiros/paged-collections/issues"

[dependency-groups]
dev = ["maturin>=1.16,<2", "pytest>=8"]

[tool.maturin]
manifest-path = "crates/paged-collections-python/Cargo.toml"
python-source = "python"
module-name = "paged_collections._core"
features = ["pyo3/extension-module"]
# The sdist carries the whole workspace so builds from it match the repo.
include = [
    { path = "Cargo.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "crates/paged-collections/**/*", format = "sdist" },
    { path = "crates/paged-collections-python/**/*", format = "sdist" },
]
exclude = ["target/**/*"]

[tool.uv]
# Rebuild the extension when the Rust sources change, not only pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/paged-collections/Cargo.toml" },
    { file = "crates/paged-collections/src/**/*.rs" },
    { file = "crates/paged-collections-python/Cargo.toml" },
    { file = "crates/paged-collections-python/build.rs" },
    { file = "crates/paged-collections-python/src/**/*.rs" },
    # build.rs reads these; a changed size list must rebuild the extension.
    { env = "PAGED_COLLECTIONS_PAGE_SIZES" },
    { env = "PAGED_COLLECTIONS_DEFAULT_PAGE_SIZE" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
