<svg xmlns="http://www.w3.org/2000/svg" width="480" height="266" viewBox="0 0 480 266" role="img" aria-labelledby="title desc">
  <title id="title">A recycled id and the independent entry in its side table</title>
  <desc id="desc">Freeing id (0, 1) and allocating again gives id (0, 2). The score map still stores score 10 for (0, 1), so looking up (0, 2) misses.</desc>
  <style>
    text { fill: #202b45; font: 600 17px system-ui, sans-serif; }
    .heading { font-size: 20px; font-weight: 700; }
    .small { fill: #53627c; font-size: 16px; font-weight: 500; }
    .mono { font-family: ui-monospace, monospace; }
    .index-text { fill: #3730a3; }
    .storage-text { fill: #0c6656; }
    .frame { fill: #f7f8fc; stroke: #d2daea; }
    .cell { fill: #ffffff; stroke: #8795b0; }
    .index { fill: #e7e9ff; stroke: #3730a3; }
    .storage { fill: #def6ed; stroke: #0c6656; }
    .connector { fill: none; stroke: #8795b0; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .arrowhead { fill: #8795b0; }
    @media (prefers-color-scheme: dark) {
      text { fill: #edf2fc; }
      .small { fill: #becbe3; }
      .index-text { fill: #c1c7ff; }
      .storage-text { fill: #9aead1; }
      .frame { fill: #141e32; stroke: #41516e; }
      .cell { fill: #1c2940; stroke: #8294b6; }
      .index { fill: #2d3565; stroke: #c1c7ff; }
      .storage { fill: #193f42; stroke: #9aead1; }
      .connector { stroke: #8294b6; }
      .arrowhead { fill: #8294b6; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="arrowhead" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>

  <rect class="frame" x="0.5" y="0.5" width="479" height="265" rx="16"/>
  <text x="22" y="39" class="heading">IdAllocator</text>
  <text x="255" y="39" class="heading">Score map</text>
  <text x="22" y="65" class="small">Live ID (index, generation)</text>
  <text x="255" y="65" class="small">Stored ID and score</text>
  <rect class="storage" x="22" y="78" width="203" height="44" rx="6"/>
  <rect class="cell" x="255" y="78" width="203" height="44" rx="6"/>
  <text x="123.5" y="106" class="mono storage-text" text-anchor="middle">(0, 1)</text>
  <text x="356.5" y="106" class="mono" text-anchor="middle">(0, 1) → 10</text>
  <path class="connector" d="M53 126 V169" marker-end="url(#arrow)"/>
  <text x="66" y="151" class="small">Free, then reuse slot 0</text>
  <rect class="index" x="22" y="174" width="203" height="44" rx="6"/>
  <rect class="cell" x="255" y="174" width="203" height="44" rx="6"/>
  <text x="123.5" y="202" class="mono index-text" text-anchor="middle">(0, 2)</text>
  <text x="356.5" y="202" class="mono" text-anchor="middle">(0, 1) → 10</text>
  <text x="255" y="245" class="mono index-text">Lookup (0, 2) → miss</text>
</svg>
