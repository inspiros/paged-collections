<svg xmlns="http://www.w3.org/2000/svg" width="480" height="148" viewBox="0 0 480 148" role="img" aria-labelledby="title desc">
  <title id="title">Pushing at both ends of a paged deque</title>
  <desc id="desc">The left and right pushes fill a slot at each end of two pages. The middle elements A through D remain in the same slots.</desc>
  <style>
    text { fill: #202b45; font: 600 17px system-ui, sans-serif; }
    .small { fill: #53627c; font-size: 16px; font-weight: 500; }
    .mono { font-family: ui-monospace, monospace; }
    .index-text { fill: #3730a3; }
    .storage-text { fill: #0c6656; }
    .frame { fill: #f7f8fc; stroke: #d2daea; }
    .panel { fill: #ffffff; stroke: #d2daea; }
    .index { fill: #e7e9ff; stroke: #3730a3; }
    .storage { fill: #def6ed; stroke: #0c6656; }
    .connector { fill: none; stroke: #8795b0; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .index-line { stroke: #3730a3; }
    .index-arrowhead { fill: #3730a3; }
    @media (prefers-color-scheme: dark) {
      text { fill: #edf2fc; }
      .small { fill: #becbe3; }
      .index-text { fill: #c1c7ff; }
      .storage-text { fill: #9aead1; }
      .frame { fill: #141e32; stroke: #41516e; }
      .panel { fill: #1c2940; stroke: #41516e; }
      .index { fill: #2d3565; stroke: #c1c7ff; }
      .storage { fill: #193f42; stroke: #9aead1; }
      .connector { stroke: #8294b6; }
      .index-line { stroke: #c1c7ff; }
      .index-arrowhead { fill: #c1c7ff; }
    }
  </style>
  <defs>
    <marker id="index" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="index-arrowhead" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>

  <rect class="frame" x="0.5" y="0.5" width="479" height="147" rx="16"/>
  <text x="90" y="34" class="mono index-text" text-anchor="middle">push_front</text>
  <text x="390" y="34" class="mono index-text" text-anchor="middle">push_back</text>
  <path class="connector index-line" d="M90 42 V64" marker-end="url(#index)"/>
  <path class="connector index-line" d="M390 42 V64" marker-end="url(#index)"/>
  <rect class="panel" x="64" y="68" width="162" height="50" rx="8"/>
  <rect class="index" x="70" y="74" width="40" height="38" rx="6"/>
  <text x="90.0" y="99.0" class="mono index-text" text-anchor="middle">L</text>
  <rect class="storage" x="125" y="74" width="40" height="38" rx="6"/>
  <text x="145.0" y="99.0" class="mono storage-text" text-anchor="middle">A</text>
  <rect class="storage" x="180" y="74" width="40" height="38" rx="6"/>
  <text x="200.0" y="99.0" class="mono storage-text" text-anchor="middle">B</text>
  <text x="145" y="138" class="small" text-anchor="middle">Page 0</text>
  <rect class="panel" x="254" y="68" width="162" height="50" rx="8"/>
  <rect class="storage" x="260" y="74" width="40" height="38" rx="6"/>
  <text x="280.0" y="99.0" class="mono storage-text" text-anchor="middle">C</text>
  <rect class="storage" x="315" y="74" width="40" height="38" rx="6"/>
  <text x="335.0" y="99.0" class="mono storage-text" text-anchor="middle">D</text>
  <rect class="index" x="370" y="74" width="40" height="38" rx="6"/>
  <text x="390.0" y="99.0" class="mono index-text" text-anchor="middle">R</text>
  <text x="335" y="138" class="small" text-anchor="middle">Page 1</text>
</svg>
