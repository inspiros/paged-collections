<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
  <title id="title">Growing a Vec and a PagedVec</title>
  <desc id="desc">When a full Vec moves its buffer on push, A and B move to a new address with C. A PagedVec leaves A and B in the first page and puts C in a second page.</desc>
  <style>
    text { fill: #202b45; font: 600 17px system-ui, sans-serif; }
    .heading { font-size: 20px; font-weight: 700; }
    .small { fill: #53627c; font-size: 16px; font-weight: 500; }
    .mono { font-family: ui-monospace, monospace; }
    .index-text { fill: #3730a3; }
    .storage-text { fill: #0c6656; }
    .frame { fill: #f7f8fc; stroke: #d2daea; }
    .panel { fill: #ffffff; stroke: #d2daea; }
    .cell { fill: #ffffff; stroke: #8795b0; }
    .empty { fill: none; stroke: #8795b0; stroke-dasharray: 4 3; }
    .index { fill: #e7e9ff; stroke: #3730a3; }
    .storage { fill: #def6ed; stroke: #0c6656; }
    .rule { fill: none; stroke: #d2daea; }
    .connector { fill: none; stroke: #8795b0; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .arrowhead { fill: #8795b0; }
    @media (prefers-color-scheme: dark) {
      text { fill: #edf2fc; }
      .small { fill: #becbe3; }
      .index-text { fill: #c1c7ff; }
      .storage-text { fill: #9aead1; }
      .frame { fill: #141e32; stroke: #41516e; }
      .panel { fill: #1c2940; stroke: #41516e; }
      .cell { fill: #1c2940; stroke: #8294b6; }
      .empty { stroke: #8294b6; }
      .index { fill: #2d3565; stroke: #c1c7ff; }
      .storage { fill: #193f42; stroke: #9aead1; }
      .rule { stroke: #41516e; }
      .connector { stroke: #8294b6; }
      .arrowhead { fill: #8294b6; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="arrowhead" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>

  <rect class="frame" x="0.5" y="0.5" width="479" height="299" rx="16"/>
  <text x="22" y="34" class="heading">Before</text>
  <text x="264" y="34" class="heading">After push(C)</text>
  <path class="rule" d="M22 48 H458"/>

  <!-- Illustrates the case where the contiguous buffer moves. -->
  <text x="22" y="78" class="heading mono">Vec</text>
  <text x="22" y="103" class="small">Buffer at address 1</text>
  <text x="264" y="103" class="small">Buffer at address 2</text>
  <rect class="cell" x="22" y="114" width="36" height="34" rx="6"/>
  <text x="40.0" y="137.0" class="mono" text-anchor="middle">A</text>
  <rect class="cell" x="62" y="114" width="36" height="34" rx="6"/>
  <text x="80.0" y="137.0" class="mono" text-anchor="middle">B</text>
  <rect class="cell" x="264" y="114" width="36" height="34" rx="6"/>
  <text x="282.0" y="137.0" class="mono" text-anchor="middle">A</text>
  <rect class="cell" x="304" y="114" width="36" height="34" rx="6"/>
  <text x="322.0" y="137.0" class="mono" text-anchor="middle">B</text>
  <rect class="index" x="344" y="114" width="36" height="34" rx="6"/>
  <text x="362.0" y="137.0" class="mono index-text" text-anchor="middle">C</text>
  <path class="connector" d="M185 131 H244" marker-end="url(#arrow)"/>
  <path class="rule" d="M22 168 H458"/>

  <!-- The first page keeps its address and the second page holds the new element. -->
  <text x="22" y="197" class="heading mono">PagedVec</text>
  <text x="458" y="197" text-anchor="end" class="small">2 slots per page</text>
  <text x="22" y="229" class="small storage-text">Page at address 1</text>
  <text x="264" y="229" class="small storage-text">Address 1</text>
  <text x="370" y="229" class="small">Address 2</text>
  <rect class="storage" x="20" y="239" width="84" height="40" rx="6"/>
  <rect class="storage" x="262" y="239" width="84" height="40" rx="6"/>
  <rect class="panel" x="368" y="239" width="84" height="40" rx="6"/>
  <rect class="storage" x="24" y="243" width="36" height="32" rx="6"/>
  <text x="42.0" y="265.0" class="mono storage-text" text-anchor="middle">A</text>
  <rect class="storage" x="64" y="243" width="36" height="32" rx="6"/>
  <text x="82.0" y="265.0" class="mono storage-text" text-anchor="middle">B</text>
  <rect class="storage" x="266" y="243" width="36" height="32" rx="6"/>
  <text x="284.0" y="265.0" class="mono storage-text" text-anchor="middle">A</text>
  <rect class="storage" x="306" y="243" width="36" height="32" rx="6"/>
  <text x="324.0" y="265.0" class="mono storage-text" text-anchor="middle">B</text>
  <rect class="index" x="372" y="243" width="36" height="32" rx="6"/>
  <text x="390.0" y="265.0" class="mono index-text" text-anchor="middle">C</text>
  <rect class="empty" x="412" y="243" width="36" height="32" rx="6"/>
  <text x="430.0" y="265.0" class="mono small" text-anchor="middle">–</text>
  <path class="connector" d="M185 259 H244" marker-end="url(#arrow)"/>
</svg>
