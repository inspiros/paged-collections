<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title">
  <title id="title">With PAGE = 4, key 9 uses page 2, slot 1, holding dense position 3</title>
  <style>
    text { font-family: system-ui, sans-serif; fill: #64748b; font-size: 16px; font-weight: 600; }
    .small { font-size: 14px; }
    .caption { font-size: 13px; }
    .line { fill: none; stroke: #64748b; stroke-width: 2; }
    .highlight { fill: none; stroke: #64748b; stroke-width: 2.5; }
    .empty { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .muted { fill: #94a3b8; font-weight: 400; }
    @media (prefers-color-scheme: dark) { text { fill: #94a3b8; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Integer division and remainder choose the directory entry and page slot. -->
  <rect class="line" x="30" y="25" width="110" height="46" rx="4"/>
  <text x="85" y="54" text-anchor="middle">key 9</text>
  <path class="line" d="M 140 48 H 170 V 29 H 195" marker-end="url(#arrow)"/>
  <path class="line" d="M 170 48 V 74 H 195" marker-end="url(#arrow)"/>
  <text x="210" y="35">page = 9 / 4 = 2</text>
  <text x="210" y="80">offset = 9 % 4 = 1</text>
  <text class="small" x="650" y="54">PAGE = 4 slots per page</text>

  <text x="30" y="125">directory (Flat)</text>
  <g class="small" text-anchor="middle">
    <text x="56" y="152">0</text><text x="108" y="152">1</text>
    <text x="160" y="152">2</text><text x="212" y="152">3</text>
  </g>
  <rect class="line" x="30" y="165" width="52" height="42"/>
  <rect class="empty" x="82" y="165" width="52" height="42"/>
  <rect class="highlight" x="134" y="165" width="52" height="42"/>
  <rect class="empty" x="186" y="165" width="52" height="42"/>
  <text x="56" y="192" text-anchor="middle">•</text>
  <text class="small muted" x="108" y="192" text-anchor="middle">none</text>
  <text x="160" y="192" text-anchor="middle">•</text>
  <text class="small muted" x="212" y="192" text-anchor="middle">none</text>
  <text class="caption" x="30" y="238">not allocated: lookups return absent,</text>
  <text class="caption" x="30" y="257">no memory</text>

  <!-- The page-0 connector takes the outside margin, clear of the caption. -->
  <path class="line" d="M 30 186 H 15 V 346 H 30" marker-end="url(#arrow)"/>
  <text class="small" x="30" y="309">page 0</text>
  <rect class="line" x="30" y="325" width="240" height="42"/>
  <path class="line" d="M 90 325 V 367 M 150 325 V 367 M 210 325 V 367"/>
  <g class="small" text-anchor="middle">
    <text x="60" y="351">pos 1</text><text x="120" y="351">pos 4</text>
    <text x="180" y="351">pos 2</text><text x="240" y="351">–</text>
  </g>

  <path class="highlight" d="M 160 207 V 220 H 300 V 244 H 330" marker-end="url(#arrow)"/>
  <text x="330" y="177">page 2</text>
  <g class="small" text-anchor="middle">
    <text x="360" y="208">0</text><text x="420" y="208">1</text>
    <text x="480" y="208">2</text><text x="540" y="208">3</text>
  </g>
  <rect class="line" x="330" y="220" width="240" height="48"/>
  <path class="line" d="M 390 220 V 268 M 450 220 V 268 M 510 220 V 268"/>
  <rect class="highlight" x="390" y="220" width="60" height="48"/>
  <g class="small" text-anchor="middle">
    <text x="360" y="250">–</text><text x="420" y="250">pos 3</text>
    <text x="480" y="250">–</text><text x="540" y="250">pos 0</text>
  </g>
  <text class="caption" x="460" y="296">slot for key 9</text>

  <text x="650" y="177">dense keys</text>
  <rect class="line" x="650" y="220" width="210" height="48"/>
  <path class="line" d="M 692 220 V 268 M 734 220 V 268 M 776 220 V 268 M 818 220 V 268"/>
  <rect class="highlight" x="776" y="220" width="42" height="48"/>
  <g text-anchor="middle">
    <text x="671" y="250">11</text><text x="713" y="250">0</text>
    <text x="755" y="250">2</text><text x="797" y="250">9</text><text x="839" y="250">1</text>
  </g>
  <g class="small" text-anchor="middle">
    <text x="671" y="289">0</text><text x="713" y="289">1</text>
    <text x="755" y="289">2</text><text x="797" y="289">3</text><text x="839" y="289">4</text>
  </g>
  <!-- Enter from above to avoid the dense index labels below the array. -->
  <path class="highlight" d="M 420 268 V 320 H 880 V 200 H 797 V 220" marker-end="url(#arrow)"/>
  <text class="caption" x="330" y="360">sparse set / sparse map: slot holds the dense position;</text>
  <text class="caption" x="330" y="382">values sit in a parallel dense array</text>

  <text class="small" x="30" y="435">direct map: the slot holds the value itself (no dense array)</text>
</svg>
