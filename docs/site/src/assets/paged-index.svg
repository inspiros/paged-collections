<svg xmlns="http://www.w3.org/2000/svg" width="480" height="264" viewBox="0 0 480 264" role="img" aria-labelledby="title desc">
  <title id="title">Locating key 9 with four slots per page</title>
  <desc id="desc">Key 9 divides into page number 2 and offset 1. In the Flat directory, page 1 is absent. Page 2 is allocated and its second slot holds dense position 3.</desc>
  <style>
    text { fill: #202b45; font: 600 17px system-ui, sans-serif; }
    .heading { font-size: 20px; font-weight: 700; }
    .small { fill: #53627c; font-size: 16px; font-weight: 500; }
    .mono { font-family: ui-monospace, monospace; }
    .index-text { fill: #3730a3; }
    .frame { fill: #f7f8fc; stroke: #d2daea; }
    .panel { fill: #ffffff; stroke: #d2daea; }
    .cell { fill: #ffffff; stroke: #8795b0; }
    .empty { fill: none; stroke: #8795b0; stroke-dasharray: 4 3; }
    .index { fill: #e7e9ff; stroke: #3730a3; }
    .connector { fill: none; stroke: #8795b0; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .index-line { stroke: #3730a3; }
    .index-arrowhead { fill: #3730a3; }
    @media (prefers-color-scheme: dark) {
      text { fill: #edf2fc; }
      .small { fill: #becbe3; }
      .index-text { fill: #c1c7ff; }
      .frame { fill: #141e32; stroke: #41516e; }
      .panel { fill: #1c2940; stroke: #41516e; }
      .cell { fill: #1c2940; stroke: #8294b6; }
      .empty { stroke: #8294b6; }
      .index { fill: #2d3565; stroke: #c1c7ff; }
      .connector { stroke: #8294b6; }
      .index-line { stroke: #c1c7ff; }
      .index-arrowhead { fill: #c1c7ff; }
    }
  </style>
  <defs>
    <marker id="index" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="index-arrowhead" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>

  <rect class="frame" x="0.5" y="0.5" width="479" height="263" rx="16"/>
  <rect class="panel" x="22" y="20" width="96" height="50" rx="9"/>
  <text x="70" y="51" class="heading" text-anchor="middle">Key 9</text>
  <rect class="index" x="128" y="20" width="160" height="50" rx="9"/>
  <text x="208" y="38" class="small index-text" text-anchor="middle">Page number</text>
  <text x="208" y="58" class="mono index-text" text-anchor="middle">9 ÷ 4 = 2</text>
  <rect class="index" x="298" y="20" width="160" height="50" rx="9"/>
  <text x="378" y="38" class="small index-text" text-anchor="middle">Offset</text>
  <text x="378" y="58" class="mono index-text" text-anchor="middle">9 % 4 = 1</text>

  <!-- The directory has pages 0 and 2. Only page 2 is expanded. -->
  <text x="22" y="115" class="heading">Flat directory</text>
  <text x="22" y="137" class="small">By page number</text>
  <rect class="cell" x="204" y="96" width="74" height="48" rx="6"/>
  <text x="241" y="115" class="mono" text-anchor="middle">0</text>
  <text x="241" y="135" class="small" text-anchor="middle">Present</text>
  <rect class="empty" x="285" y="96" width="74" height="48" rx="6"/>
  <text x="322" y="115" class="mono" text-anchor="middle">1</text>
  <text x="322" y="135" class="small" text-anchor="middle">Absent</text>
  <rect class="index" x="366" y="96" width="74" height="48" rx="6"/>
  <text x="403" y="115" class="mono" text-anchor="middle">2</text>
  <text x="403" y="135" class="small" text-anchor="middle">Present</text>
  <path class="connector index-line" d="M403 144 V158 H296 V180" marker-end="url(#index)"/>
  <text x="22" y="206" class="heading">Page 2 slots</text>
  <text x="22" y="228" class="small">By offset</text>
  <rect class="cell" x="200" y="184" width="60" height="58" rx="6"/>
  <text x="230" y="205" class="small mono" text-anchor="middle">0</text>
  <text x="230" y="230" class="mono" text-anchor="middle">–</text>
  <rect class="index" x="266" y="184" width="60" height="58" rx="6"/>
  <text x="296" y="205" class="small mono" text-anchor="middle">1</text>
  <text x="296" y="230" class="mono index-text" text-anchor="middle">pos 3</text>
  <rect class="cell" x="332" y="184" width="60" height="58" rx="6"/>
  <text x="362" y="205" class="small mono" text-anchor="middle">2</text>
  <text x="362" y="230" class="mono" text-anchor="middle">–</text>
  <rect class="cell" x="398" y="184" width="60" height="58" rx="6"/>
  <text x="428" y="205" class="small mono" text-anchor="middle">3</text>
  <text x="428" y="230" class="mono" text-anchor="middle">pos 0</text>
</svg>
