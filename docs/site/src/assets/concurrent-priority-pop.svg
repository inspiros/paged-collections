<svg xmlns="http://www.w3.org/2000/svg" width="480" height="227" viewBox="0 0 480 227" role="img" aria-labelledby="title desc">
  <title id="title">Relaxed and exact pops from a sharded max-priority queue</title>
  <desc id="desc">For shard tops 45, 70, 95, and 35, a pop sampling shards 0 and 1 takes priority 70. An exact pop from the same starting state takes 95.</desc>
  <style>
    text { fill: #202b45; font: 600 17px system-ui, sans-serif; }
    .heading { font-size: 20px; font-weight: 700; }
    .small { fill: #53627c; font-size: 16px; font-weight: 500; }
    .mono { font-family: ui-monospace, monospace; }
    .index-text { fill: #3730a3; }
    .storage-text { fill: #0c6656; }
    .frame { fill: #f7f8fc; stroke: #d2daea; }
    .cell { fill: #ffffff; stroke: #8795b0; }
    .index { fill: #e7e9ff; stroke: #3730a3; }
    .storage { fill: #def6ed; stroke: #0c6656; }
    @media (prefers-color-scheme: dark) {
      text { fill: #edf2fc; }
      .small { fill: #becbe3; }
      .index-text { fill: #c1c7ff; }
      .storage-text { fill: #9aead1; }
      .frame { fill: #141e32; stroke: #41516e; }
      .cell { fill: #1c2940; stroke: #8294b6; }
      .index { fill: #2d3565; stroke: #c1c7ff; }
      .storage { fill: #193f42; stroke: #9aead1; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="479" height="226" rx="16"/>
  <text x="22" y="37" class="heading">Top priority in each shard</text>
  <rect class="index" x="22" y="54" width="100" height="65" rx="8"/>
  <text x="72" y="77" class="small" text-anchor="middle">Shard 0</text>
  <text x="72" y="104" class="mono" text-anchor="middle">45</text>
  <rect class="index" x="134" y="54" width="100" height="65" rx="8"/>
  <text x="184" y="77" class="small" text-anchor="middle">Shard 1</text>
  <text x="184" y="104" class="mono" text-anchor="middle">70</text>
  <rect class="storage" x="246" y="54" width="100" height="65" rx="8"/>
  <text x="296" y="77" class="small" text-anchor="middle">Shard 2</text>
  <text x="296" y="104" class="mono" text-anchor="middle">95</text>
  <rect class="cell" x="358" y="54" width="100" height="65" rx="8"/>
  <text x="408" y="77" class="small" text-anchor="middle">Shard 3</text>
  <text x="408" y="104" class="mono" text-anchor="middle">35</text>
  <rect class="index" x="22" y="148" width="211" height="60" rx="8"/>
  <rect class="storage" x="247" y="148" width="211" height="60" rx="8"/>
  <text x="127.5" y="173" class="mono index-text" text-anchor="middle">pop → 70</text>
  <text x="352.5" y="173" class="mono storage-text" text-anchor="middle">pop_exact → 95</text>
  <text x="127.5" y="195" class="small" text-anchor="middle">Samples shards 0 and 1</text>
  <text x="352.5" y="195" class="small" text-anchor="middle">Checks all four shards</text>
</svg>
